name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm test
      # OIDC trusted publishing: npm detects the GitHub OIDC token automatically
      # and attaches provenance. Do not set NODE_AUTH_TOKEN/NPM_TOKEN here, or npm
      # falls back to token auth. Requires the trusted publisher configuration on
      # npmjs.com (see README) and a package that already exists on npm.
      - run: npm publish --access public
